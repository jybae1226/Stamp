name: stampletter_flutter
description: A cross-platform StampLetter app built with Flutter.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  image_picker: ^1.2.2
  path_provider: ^2.0.15
  share_plus: ^6.3.4
  permission_handler: ^10.4.2
  image_gallery_saver: ^1.7.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
flutter:
  uses-material-design: true
